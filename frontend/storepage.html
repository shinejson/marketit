<!doctype html>
<html lang="en">
<head>
  <script type="module" src="/@vite/client"></script>

  <meta charset="utf-8">
  <title>MarketHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script>
    // Suppress unhandled errors injected by third-party browser extensions (e.g. Urban VPN 200.js)
    window.addEventListener('unhandledrejection', function(e) {
      var r = e && e.reason;
      var msg = (r && (r.message || String(r))) || '';
      var stack = (r && r.stack) || '';
      if (msg.includes('M_ID') || stack.includes('200.js') || stack.includes('chrome-extension:')) {
        e.preventDefault();
      }
    });
    window.addEventListener('error', function(e) {
      var msg = (e && e.message) || '';
      var fn = (e && e.filename) || '';
      if (msg.includes('M_ID') || fn.includes('200.js') || fn.includes('chrome-extension:')) {
        e.preventDefault();
      }
    });
  </script>
<link rel="stylesheet" href="styles.css"></head>
<body>
  <app-root></app-root>
<script src="polyfills.js" type="module"></script><script src="main.js" type="module"></script></body>
</html>
